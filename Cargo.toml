[package]
name = "turbosearch"
version = "0.1.0"
edition = "2024"

[dependencies]
zip = "7"
redb = "4"
thiserror = "2"
zstd = "0.13"
lol_html = "1"
quick-xml = "0.37"
unicode-normalization = "0.1"  # NFD + NFKC for term normalization
encoding_rs = "0.8"
memchr = "2"

[dev-dependencies]
rand = "0.9"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
