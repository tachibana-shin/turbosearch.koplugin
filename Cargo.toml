[package]
name = "turbosearch"
version = "0.1.0"
edition = "2024"

[lib]
# cdylib for the LuaJIT FFI, rlib so the internal tests keep building.
crate-type = ["cdylib", "rlib"]

[dependencies]
zip = "7"
thiserror = "2"
zstd = "0.13"
lol_html = "1"
quick-xml = "0.37"
unicode-normalization = "0.1"  # NFD + NFKC for term normalization
encoding_rs = "0.8"
memchr = "2"
regex = "1"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "macros"] }
tokio = { version = "1.53.2", features = ["rt", "macros"] }

[dev-dependencies]
rand = "0.9"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# No `panic = "abort"`: the FFI's error contract is every entry point running
# under catch_unwind and reporting through ts_last_error, and aborting on
# unwinding would break that promise — verified by building a scratch crate
# both ways, where abort turned a catch_unwind into SIGABRT. This is a library
# dropped into KOReader's long-running process, so an abort on an indexing or
# query panic would take the reader down with it.
strip = true
