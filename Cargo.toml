[package]
name = "turbosearch"
version = "0.1.0"
edition = "2024"

[dependencies]
zip = "7"
thiserror = "2"
zstd = "0.13"
lol_html = "1"
quick-xml = "0.37"
unicode-normalization = "0.1"  # NFD + NFKC for term normalization
encoding_rs = "0.8"
memchr = "2"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "macros"] }
tokio = { version = "1.53.2", features = ["rt", "macros"] }

[dev-dependencies]
rand = "0.9"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
